# ===== DATASOURCE (POSTGRES) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== JWT =====
spring.config.import=optional:file:.env[.properties]
security.jwt.secret=${TICKETFLOW_JWT_SECRET}
# access token : 15 min
security.jwt.expiration=900000
# 30 min  (glissant, lastUsedAt)
security.jwt.refresh.idle-timeout=1800000
# 8 h     (absolu, createdAt)
security.jwt.refresh.max-session=28800000

# ===== SWAGGER ===== #
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enable=false
